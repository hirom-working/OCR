# OCR Pipeline Configuration
# Copy this file to config.toml and customize for your environment

[local]
# Local client directories
output_dir = "~/電子図書"
work_dir = "~/Projects/OCR/work"

[pipeline]
# Batch pipeline directories on remote host
input_dir = "~/ocr_pipeline_input"
output_dir = "~/ocr_pipeline_output"

[llm]
# Gemini API for title/author/category classification
# APIキーは1Password (op://Dev/Google-AI-Studio/GEMINI_API_KEY) から実行時に取得
model = "gemini-3.6-flash"
